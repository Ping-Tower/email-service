services:
  email-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${EMAIL_SERVICE_IMAGE_NAME}
    container_name: email-service
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${EMAIL_SERVICE_DOTNET_ENVIRONMENT}
      RabbitMqSettings__HostName: ${EMAIL_SERVICE_RABBITMQ_HOST}
      RabbitMqSettings__Port: ${EMAIL_SERVICE_RABBITMQ_PORT}
      RabbitMqSettings__UserName: ${EMAIL_SERVICE_RABBITMQ_USERNAME}
      RabbitMqSettings__Password: ${EMAIL_SERVICE_RABBITMQ_PASSWORD}
      RabbitMqSettings__MainQueue: ${EMAIL_SERVICE_RABBITMQ_MAIN_QUEUE}
      SmtpSettings__Host: ${EMAIL_SERVICE_SMTP_HOST}
      SmtpSettings__Port: ${EMAIL_SERVICE_SMTP_PORT}
      SmtpSettings__UserName: ${EMAIL_SERVICE_SMTP_USERNAME}
      SmtpSettings__Password: ${EMAIL_SERVICE_SMTP_PASSWORD}
      SmtpSettings__FromAddress: ${EMAIL_SERVICE_SMTP_FROM_ADDRESS}
      SmtpSettings__FromName: ${EMAIL_SERVICE_SMTP_FROM_NAME}
    networks:
      - pingtower_network

networks:
  pingtower_network:
    name: pingtower_network
    external: true
