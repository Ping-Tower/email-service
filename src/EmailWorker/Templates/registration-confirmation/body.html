<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your PingTower account</title>
</head>
<body style="margin:0;padding:0;background:#eef3f8;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#10243e;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef3f8;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px rgba(16,36,62,0.14);">
          <tr>
            <td style="background:linear-gradient(135deg,#0f3d91 0%,#17a9d4 100%);padding:40px 40px 56px;color:#ffffff;">
              <div style="font-size:12px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.82;">PingTower</div>
              <h1 style="margin:16px 0 0;font-size:34px;line-height:1.15;">Welcome aboard, {{userName}}</h1>
              <p style="margin:16px 0 0;font-size:16px;line-height:1.7;max-width:420px;opacity:0.94;">Use the verification code below to activate your account and start receiving monitoring alerts.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:40px;">
              <div style="background:#f4f8fc;border:1px solid #dce7f3;border-radius:20px;padding:28px;text-align:center;">
                <div style="font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:#58708d;">Verification code</div>
                <div style="margin-top:14px;font-size:32px;font-weight:700;letter-spacing:0.28em;color:#0f3d91;">{{verificationCode}}</div>
              </div>
              <p style="margin:28px 0 0;font-size:15px;line-height:1.8;color:#4b6078;">If you did not create a PingTower account, you can safely ignore this message.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
