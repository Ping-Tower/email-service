<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server down</title>
</head>
<body style="margin:0;padding:0;background:#f7f2f1;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#2c1a19;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f2f1;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px rgba(44,26,25,0.12);">
          <tr>
            <td style="background:linear-gradient(135deg,#7d1622 0%,#d63c4a 100%);padding:40px 40px 56px;color:#ffffff;">
              <div style="font-size:12px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.82;">PingTower alert</div>
              <h1 style="margin:16px 0 0;font-size:34px;line-height:1.15;">{{serverName}} is unavailable</h1>
              <p style="margin:16px 0 0;font-size:16px;line-height:1.7;max-width:440px;opacity:0.94;">PingTower detected a DOWN state for your monitored target and triggered this notification.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:40px;">
              <div style="border:1px solid #f1d3d7;border-radius:20px;padding:24px;background:#fff8f8;">
                <div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#8d5660;">Host</div>
                <div style="margin-top:10px;font-size:22px;font-weight:700;color:#7d1622;">{{host}}</div>
                <div style="margin-top:24px;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#8d5660;">Observed at</div>
                <div style="margin-top:10px;font-size:16px;color:#4c3a3c;">{{timestampUtc}}</div>
              </div>
              <p style="margin:28px 0 0;font-size:15px;line-height:1.8;color:#5e4749;">Status: <strong>{{status}}</strong>. Check the target and its dependencies as soon as possible.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
