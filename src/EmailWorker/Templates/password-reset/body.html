<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your PingTower password</title>
</head>
<body style="margin:0;padding:0;background:#f2f6fb;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#14263d;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2f6fb;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px rgba(20,38,61,0.14);">
          <tr>
            <td style="background:linear-gradient(135deg,#0b6e4f 0%,#29b383 100%);padding:40px 40px 56px;color:#ffffff;">
              <div style="font-size:12px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.82;">PingTower security</div>
              <h1 style="margin:16px 0 0;font-size:34px;line-height:1.15;">Reset your password</h1>
              <p style="margin:16px 0 0;font-size:16px;line-height:1.7;max-width:440px;opacity:0.94;">We received a request to reset the password for {{recipient}}. Use the secure link below to continue.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:40px;">
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 auto;">
                <tr>
                  <td align="center" style="border-radius:999px;background:#0b6e4f;">
                    <a href="{{resetUrl}}" style="display:inline-block;padding:16px 30px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;">Reset password</a>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0;font-size:14px;line-height:1.8;color:#53667c;">If the button does not work, copy and paste this URL into your browser:</p>
              <p style="margin:12px 0 0;font-size:14px;line-height:1.8;word-break:break-all;color:#0b6e4f;">{{resetUrl}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
