# Читает Variables из проекта pingtower/email-service (id 77545817).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-pingtower-email-service
  namespace: pingtower
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "77545817"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            key: token
