# Читает Variables из проекта pingtower/email-service.
# projectID замени на числовой ID перед первым деплоем.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-pingtower-email-service
  namespace: pingtower
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "REPLACE_WITH_EMAIL_SERVICE_PROJECT_ID"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            key: token
