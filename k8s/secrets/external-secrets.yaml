# Variables репозитория pingtower/email-service → Kubernetes Secret.
# Настройки Variables: Masked, Protected, environment scope *, Expand выключен.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-service
  namespace: pingtower
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-pingtower-email-service
    kind: SecretStore
  target:
    name: email-service
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: smtp-host
      remoteRef:
        key: EMAIL_SERVICE_SMTP_HOST
    - secretKey: smtp-port
      remoteRef:
        key: EMAIL_SERVICE_SMTP_PORT
    - secretKey: smtp-username
      remoteRef:
        key: EMAIL_SERVICE_SMTP_USERNAME
    - secretKey: smtp-password
      remoteRef:
        key: EMAIL_SERVICE_SMTP_PASSWORD
    - secretKey: smtp-from-address
      remoteRef:
        key: EMAIL_SERVICE_SMTP_FROM_ADDRESS
    - secretKey: smtp-from-name
      remoteRef:
        key: EMAIL_SERVICE_SMTP_FROM_NAME
