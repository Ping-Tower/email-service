stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# Note: unit/integration test jobs are kept as-is from the repo's own pipeline.
unit_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet test tests/UnitTests/UnitTests.csproj
        -c Release
        --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/unit.xml"
  artifacts:
    when: always
    reports:
      junit: test-results/unit.xml

integration_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet test tests/IntegrationTests/IntegrationTests.csproj
        -c Release
        --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/integration.xml"
  artifacts:
    when: always
    reports:
      junit: test-results/integration.xml

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - docker buildx create --use --driver docker-container --driver-opt network=host
    - docker buildx build --pull --provenance=false --sbom=false
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max
        -t $DOCKER_IMAGE_NAME --push .

# K8s-deploy: манифесты в k8s/, деплой через GitLab Agent.
deploy:
  stage: deploy
  needs: [build_image]
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  resource_group: pingtower-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть email-service в production?"
  timeout: 20m
  script:
    - kubectl config use-context pingtower/infra:pingtower
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml
    - kubectl apply --dry-run=server -k k8s/
    # Секреты SMTP (Store email-service → ExternalSecret email-service).
    - kubectl -n pingtower apply -f k8s/secrets/store.yaml
    - kubectl -n pingtower wait --for=condition=Ready secretstore/gitlab-pingtower-email-service --timeout=120s
    - kubectl -n pingtower apply -f k8s/secrets/external-secrets.yaml
    - kubectl -n pingtower wait --for=condition=Ready externalsecret/email-service --timeout=120s
    # Инфраструктурные секреты — владелец pingtower-infra.
    - kubectl -n pingtower wait --for=condition=Ready
        externalsecret/rabbitmq externalsecret/gitlab-registry --timeout=120s
    - kubectl -n pingtower get secret email-service rabbitmq gitlab-registry -o name
    - kubectl apply -k k8s/
    - kubectl -n pingtower rollout status deployment/email-service --timeout=600s
